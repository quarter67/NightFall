<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightFall — Key Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <div id="loginScreen" class="admin-login">
    <div class="card">
      <div class="badge">NightFall Admin</div>
      <h1>Key Dashboard</h1>
      <p class="lead">Enter your admin secret to manage keys.</p>
      <input id="secretInput" type="password" placeholder="Admin secret" />
      <button id="loginBtn" class="btn-primary">Sign in</button>
      <p id="loginError" class="status err hidden"></p>
    </div>
  </div>

  <div id="dashboard" class="admin-dashboard hidden">
    <header class="admin-header">
      <div>
        <div class="badge">NightFall Admin</div>
        <h1>Keys <span id="keyCount" class="count-pill">0</span></h1>
      </div>
      <div class="admin-actions">
        <button id="exportBtn" class="btn-secondary">Export</button>
        <button id="deleteExpiredBtn" class="btn-danger-outline">Delete expired</button>
        <button id="batchCreateBtn" class="btn-secondary">Batch create</button>
        <button id="createKeyBtn" class="btn-primary inline">+ Create key</button>
      </div>
    </header>

    <div class="admin-toolbar card">
      <input id="searchInput" type="search" placeholder="Search key, HWID, note, IP..." />
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="used">Used</button>
        <button class="filter-btn" data-filter="expired">Expired</button>
        <button class="filter-btn" data-filter="revoked">Revoked</button>
      </div>
    </div>

    <div id="statsRow" class="stats-row"></div>
    <div id="keysList" class="keys-list"></div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card card">
      <h2 id="modalTitle">Edit key</h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn-secondary">Cancel</button>
        <button id="modalSave" class="btn-primary inline">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
