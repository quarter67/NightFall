<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightFall — Your Key</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <main class="page">
    <header class="hero hero-compact">
      <div class="badge">NightFall Key</div>
      <h1 id="title">Checking session…</h1>
      <p id="subtitle" class="lead"></p>
    </header>

    <section class="card card-key">
      <div id="waiting" class="waiting hidden">
        <div class="spinner"></div>
        <p>Waiting for ad completion…</p>
        <p class="muted">If you just finished, give it a few seconds.</p>
      </div>

      <div id="success" class="hidden">
        <label for="keyBox">Your key</label>
        <div class="key-row">
          <input id="keyBox" readonly />
          <button id="copyBtn" class="btn-secondary">Copy</button>
        </div>
        <p class="hint">Paste this into the NightFall loader and click Continue.</p>
      </div>

      <div id="error" class="error-box hidden">
        <p id="errorText"></p>
        <a href="/" class="btn-secondary inline">Back to Get Key</a>
      </div>
    </section>

    <footer class="footer">
      <a href="/">← Get another key</a>
    </footer>
  </main>

  <script src="/js/key.js"></script>
</body>
</html>
